# Builds Sumi for iPhone on GitHub's macOS machines and attaches an
# unsigned .ipa to the run. Sign and install it from a Windows PC with
# Sideloadly (see README: "On an iPhone, without a Mac").
name: iOS build

# Pushes to main build and publish. Pushes to a try/… branch only build,
# so a change can be compiled before it replaces the published app.
on:
  push:
    branches: [main, "try/**"]
    paths:
      - "Sumi.swiftpm/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Use the newest released Xcode on this machine
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for iPhone without signing
        working-directory: Sumi.swiftpm
        run: |
          set -o pipefail
          xcodebuild -scheme Sumi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build.log | grep -E 'error:|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' ../build.log

      # The log needs a GitHub login to read; annotations don't. Every
      # compile error becomes one, so a failed build explains itself on
      # the run's page (and through the public API).
      - name: Report compile errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re

          root = os.environ.get("GITHUB_WORKSPACE", "") + "/"
          lines = open("build.log", errors="replace").read().splitlines()
          seen, errors = set(), []
          for line in lines:
              if ": error: " not in line and not line.startswith("error: "):
                  continue
              line = line.replace(root, "")
              if line not in seen:
                  seen.add(line)
                  errors.append(line)

          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for line in errors[:9]:
              match = re.match(r"(.+?):(\d+):(\d+): error: (.*)", line)
              if match:
                  print(f"::error file={match.group(1)},line={match.group(2)},col={match.group(3)}::{esc(match.group(4))}")
              else:
                  print(f"::error::{esc(line)}")

          rows = [e.replace("Sumi.swiftpm/Sources/", "") for e in errors] or lines[-60:]
          chunks, chunk = [], ""
          for row in rows:
              if len(chunk) + len(row) > 3000:
                  chunks.append(chunk)
                  chunk = ""
              chunk += row + "\n"
          if chunk:
              chunks.append(chunk)
          for index, chunk in enumerate(chunks[:10]):
              print(f"::notice title=Build errors {index + 1} of {len(chunks)}::{esc(chunk)}")
          PY

      - name: Package as .ipa
        run: |
          APP=$(find build/Build/Products -type d -name 'Sumi.app' | head -n 1)
          test -n "$APP" || { echo "Sumi.app not found"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Sumi-unsigned.ipa Payload
          ls -la Sumi-unsigned.ipa

      - name: Attach the .ipa to this run
        uses: actions/upload-artifact@v4
        with:
          name: Sumi-unsigned-ipa
          path: Sumi-unsigned.ipa
          if-no-files-found: error

      # Artifacts need a GitHub login to download; a release asset is a
      # plain link that works from any device. "latest" is replaced on
      # every successful build of main.
      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Sumi-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sumi — latest build" \
            --notes "Unsigned iPhone build of commit ${GITHUB_SHA::7}. Sign and install it with Sideloadly (see the README)."

      - name: Attach the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
